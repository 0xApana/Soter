name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --engine-strict=false

      - name: Run Prisma migrations
        working-directory: app/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Verify contract spec & generated types drift
        run: |
          python3 app/onchain/scripts/export-spec.py
          node app/backend/scripts/generate-contract-types.js
          git diff --exit-code app/onchain/contracts/aid_escrow/contract-spec.json app/backend/src/onchain/generated/

      - name: Lint
        run: pnpm --filter backend run lint

      - name: Test
        run: pnpm --filter backend run test
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Build
        run: pnpm --filter backend run build
